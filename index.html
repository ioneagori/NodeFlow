    }

      height: 6px;

      background-image:

        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    }
    .fixed-node-grid-light {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-brandLight dark:bg-brandDark text-zinc-800 dark:text-zinc-200 min-h-screen selection:bg-emerald-500/30">
  <div id="root"></div>

  <script type="text/babel">

        defaultWorkflow: {
          title: "기본 텍스트-투-이미지 (Text-to-Image) 표준 파이프라인",

          generalGuide: "ComfyUI의 가장 기초적이고 신뢰성 높은 Text-to-Image 표준 아키텍처입니다. Checkpoint에서 출력되는 MODEL, CLIP, VAE가 각각 알맞은 샘플러와 텍스트 인코더, 디코더에 매핑되어 작동합니다.",
          stages: [
            {
              stageName: "01. Input & Model Loaders",

                {

                  tip: "목적에 맞는 safetensors 체크포인트를 선택하세요.",
                  params: [
                    { key: "ckpt_name", val: "v1-5-pruned-emaonly.safetensors", desc: "사용할 베이스 체크포인트 모델" }
                  ]
                },
                {

                  category: "Latent",

                  summary: "초기 잠재 공간(Latent) 텐서 생성",
                  details: "노이즈가 주입되어 디퓨전이 시작될 캔버스의 해상도와 배치 크기를 정의합니다.",
                  tip: "SD 1.5는 512x512, SDXL은 1024x1024 기본 해상도를 권장합니다.",
                  params: [
                    { key: "width / height", val: "512 x 512", desc: "생성 이미지 기본 해상도" },

              ]
            },
            {
              stageName: "02. Conditioning",
              nodes: [
                {
                  id: "c-3",
                  category: "Conditioning",

                  details: "사용자가 원하는 화풍, 피사체, 조명 및 디테일을 CLIP 인코더를 통해 텐서 조건으로 변환합니다.",
                  tip: "핵심 키워드를 앞쪽에 배치하면 가중치가 더 잘 반영됩니다.",

                },
                {
                  id: "c-4",
                  category: "Conditioning",
                  name: "CLIP Text Encode (Negative)",
                  summary: "부정 프롬프트 텍스트 조건화",
                  details: "결과물에서 배제하고 싶은 왜곡, 결함, 불필요한 스타일 요소를 제어합니다.",
                  tip: "과도한 부정 프롬프트는 이미지의 채도나 대비를 떨어뜨릴 수 있습니다.",

                    { key: "text", val: "worst quality, low quality, deformed, blurry, bad anatomy", desc: "부정 프롬프트 입력" }

              ]
            },
            {
              stageName: "03. Diffusion Sampling",
              nodes: [
                {
                  id: "c-5",
                  category: "Sampling",
                  name: "KSampler",
                  summary: "노이즈 제거 및 잠재 이미지 합성",
                  details: "Model과 조건화 데이터, Latent 노이즈를 취합하여 스텝 수에 맞춰 점진적으로 디노이징합니다.",
                  tip: "steps 20~25, cfg 7.0 수준이 가장 표준적이고 실패 확률이 낮습니다.",
                  params: [
                    { key: "steps", val: "20", desc: "디노이징 반복 횟수" },
                    { key: "cfg", val: "7.0", desc: "프롬프트 추종 강도" },
                    { key: "sampler_name", val: "euler", desc: "기본 오일러 샘플러" },
                    { key: "scheduler", val: "normal", desc: "표준 노이즈 스케줄러" },
                    { key: "denoise", val: "1.00", desc: "완전한 신규 생성 모드" }
                  ]
                }
              ]
            },
            {
              stageName: "04. Output & Preview",
              nodes: [
                {
                  id: "c-6",
                  category: "Output",
                  name: "Save Image",
                  summary: "VAE 디코딩 및 픽셀 이미지 저장",
                  details: "생성 완료된 잠재 공간 텐서를 VAE로 픽셀 복원하여 최종 파일로 저장합니다.",
                  tip: "메타데이터가 이미지에 자동 포함되어 재사용이 가능합니다.",
                  params: [
                    { key: "filename_prefix", val: "NodeFlow_Output", desc: "저장될 파일 접두사" }
                  ]
                }
              ]
            }
          ],
          connections: [
            { from: "c-1", to: "c-3", label: "CLIP" },
            { from: "c-1", to: "c-4", label: "CLIP" },
            { from: "c-1", to: "c-5", label: "MODEL" },
            { from: "c-2", to: "c-5", label: "LATENT" },
            { from: "c-3", to: "c-5", label: "CONDITIONING" },
            { from: "c-4", to: "c-5", label: "CONDITIONING" },
            { from: "c-1", to: "c-6", label: "VAE" },
            { from: "c-5", to: "c-6", label: "LATENT" }
          ]
        }
      },
      Blender: {
        name: "Blender",
        accent: "#10b981",
        categories: {
          Input: { label: "Input", bg: "bg-red-500", text: "text-red-400", hex: "#ef4444" },
          Texture: { label: "Texture", bg: "bg-orange-500", text: "text-orange-400", hex: "#f97316" },
          Color_Vector: { label: "Color / Vector", bg: "bg-blue-500", text: "text-blue-400", hex: "#3b82f6" },
          Converter: { label: "Converter", bg: "bg-emerald-500", text: "text-emerald-400", hex: "#10b981" },
          Shader: { label: "Shader", bg: "bg-purple-500", text: "text-purple-400", hex: "#a855f7" },
          Output: { label: "Output", bg: "bg-zinc-400", text: "text-zinc-300", hex: "#a1a1aa" }
        },
        placeholder: "예: 긁힌 자국(Scratch)과 먼지가 낀 사실적인 PBR 금속 셰이더 노드 만들어줘",
        defaultWorkflow: {
          title: "Blender 표준 PBR 머티리얼 셰이더",
          desc: "텍스처 좌표계와 노이즈가 Principled BSDF에 연결되어 뷰포트 서피스로 출력되는 기본 셰이더 트리",
          generalGuide: "Blender의 가장 기본적이고 표준적인 물리 기반 렌더링(PBR) 셰이더 구성입니다. UV/Object 좌표계를 거쳐 계산된 텍스처 데이터가 Principled BSDF를 통해 Cycles/Eevee 엔진에 출력됩니다.",
          stages: [
            {
              stageName: "01. Coordinates & Inputs",
              nodes: [
                {
                  id: "b-1",
                  category: "Input",
                  name: "Texture Coordinate",
                  summary: "메시 UV / 오브젝트 좌표계 생성",
                  details: "3D 메시 표면에 텍스처를 왜곡 없이 매핑하기 위한 기준 벡터 좌표를 생성합니다.",
                  tip: "이음새 왜곡 방지 시 Object 좌표를 권장합니다.",
                  params: [
                    { key: "Output Socket", val: "Object", desc: "절차적 3D 투영 좌표" }
                  ]
                }
              ]
            },
            {
              stageName: "02. Mapping & Texture",
              nodes: [
                {
                  id: "b-2",
                  category: "Color_Vector",
                  name: "Mapping",
                  summary: "좌표계 스케일 및 위치 조정",
                  details: "텍스처의 타일링 반복 주기와 회전 각도를 균일하게 조정합니다.",
                  tip: "스케일 수치로 텍스처 밀도를 조절하세요.",
                  params: [
                    { key: "Scale (X/Y/Z)", val: "2.0", desc: "텍스처 반복 밀도" }
                  ]
                },
                {
                  id: "b-3",
                  category: "Texture",
                  name: "Noise Texture",
                  summary: "표면 질감용 절차적 노이즈",
                  details: "수학적 알고리즘으로 표면의 불규칙한 요철 및 거칠기 맵을 계산합니다.",
                  tip: "Detail 8 이상 설정 시 사실적인 질감이 부여됩니다.",
                  params: [
                    { key: "Scale", val: "10.0", desc: "노이즈 크기" },
                    { key: "Detail", val: "8.0", desc: "프랙탈 복잡도" }
                  ]
                }
              ]
            },
            {
              stageName: "03. Shading Engine",
              nodes: [
                {
                  id: "b-4",
                  category: "Shader",
                  name: "Principled BSDF",
                  summary: "물리기반 표면 셰이딩",
                  details: "광학 물리 법칙에 기반하여 금속성, 거칠기, 반사율을 통합 시뮬레이션합니다.",
                  tip: "Roughness를 연결하여 실감나는 반사를 표현하세요.",
                  params: [
                    { key: "Base Color", val: "#C8C8C8", desc: "기본 표면 색상" },
                    { key: "Roughness", val: "0.4", desc: "기본 표면 거칠기" }
                  ]
                }
              ]
            },
            {
              stageName: "04. Material Output",
              nodes: [
                {
                  id: "b-5",
                  category: "Output",
                  name: "Material Output",
                  summary: "뷰포트 서피스 최종 바인딩",
                  details: "완성된 셰이더 트리를 실제 3D 오브젝트 Surface에 렌더링합니다.",
                  tip: "Surface 소켓에 반드시 연결되어야 렌더 엔진이 인식합니다.",
                  params: [
                    { key: "Target", val: "All Engines", desc: "Cycles 및 Eevee 공용" }
                  ]
                }
              ]
            }
          ],
          connections: [
            { from: "b-1", to: "b-2", label: "Vector" },
            { from: "b-2", to: "b-3", label: "Vector" },
            { from: "b-3", to: "b-4", label: "Fac -> Roughness" },
            { from: "b-4", to: "b-5", label: "BSDF -> Surface" }
          ]
        }
      }
    };

    function App() {
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [platform, setPlatform] = useState('ComfyUI');
      const [query, setQuery] = useState('');
      const [pipeline, setPipeline] = useState(PROGRAM_CONFIG.ComfyUI.defaultWorkflow);
      const [isCustomGenerated, setIsCustomGenerated] = useState(false);
      const [loading, setLoading] = useState(false);
      const [selectedNode, setSelectedNode] = useState(null);
      const [hoveredNodeId, setHoveredNodeId] = useState(null);
      const [savedNodes, setSavedNodes] = useState([]);
      const [savedPipelines, setSavedPipelines] = useState([]);
      const [viewSavedTab, setViewSavedTab] = useState(false);
      const [isSavedViewing, setIsSavedViewing] = useState(false);
      const [loadedSavedIndex, setLoadedSavedIndex] = useState(null);
      const [toastMessage, setToastMessage] = useState('');
      const [showScrollTop, setShowScrollTop] = useState(false);

      const [currentUser, setCurrentUser] = useState(null);
      const [authModal, setAuthModal] = useState(null);
      const [authForm, setAuthForm] = useState({ username: '', password: '', email: '', newPassword: '' });
      const [foundAccountInfo, setFoundAccountInfo] = useState(null);

      const [isPipelineOpen, setIsPipelineOpen] = useState(true);
      const [isGuideOpen, setIsGuideOpen] = useState(false);

      const [canvasZoom, setCanvasZoom] = useState(1);
      const canvasContainerRef = useRef(null);
      const canvasBoardRef = useRef(null);

      const isDraggingCanvasRef = useRef(false);
      const dragStartPosRef = useRef({ x: 0, y: 0, scrollLeft: 0, scrollTop: 0 });
      const [isCanvasGrabbing, setIsCanvasGrabbing] = useState(false);

      const [connections, setConnections] = useState([]);
      const nodeRefs = useRef({});

      const [attachedImage, setAttachedImage] = useState(null);
      const fileInputRef = useRef(null);

      const [dialogConfig, setDialogConfig] = useState(null);
      const [promptInputValue, setPromptInputValue] = useState('');

      const [dashMemoInput, setDashMemoInput] = useState('');
      const [dashLinkInput, setDashLinkInput] = useState('');
      const dashImageInputRef = useRef(null);

      const currentConfig = PROGRAM_CONFIG[platform];
      const [geminiApiKey, setGeminiApiKey] = useState("");

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const showCustomAlert = (title, message) => {
        setDialogConfig({
          type: 'alert',
          title,
          message,
          onConfirm: () => setDialogConfig(null)
        });
      };

      const showCustomConfirm = (title, message, onConfirmCallback) => {
        setDialogConfig({
          type: 'confirm',
          title,
          message,
          onConfirm: () => {
            setDialogConfig(null);
            if (onConfirmCallback) onConfirmCallback();
          },
          onCancel: () => setDialogConfig(null)
        });
      };

      const showCustomPrompt = (title, message, defaultValue, onConfirmCallback) => {
        setPromptInputValue(defaultValue || '');
        setDialogConfig({
          type: 'prompt',
          title,
          message,
          onConfirm: (val) => {
            setDialogConfig(null);
            if (onConfirmCallback) onConfirmCallback(val);
          },
          onCancel: () => setDialogConfig(null)
        });
      };

      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDarkMode]);

      useEffect(() => {
        const storedKey = localStorage.getItem('nodeflow_gemini_key');
        const storedTheme = localStorage.getItem('nodeflow_theme');
        const loggedUser = localStorage.getItem('nodeflow_logged_user');

        if (storedKey && storedKey.startsWith("AQ.Ab8RN")) {
          localStorage.removeItem('nodeflow_gemini_key');
          setGeminiApiKey("");
        } else if (storedKey) {
          setGeminiApiKey(storedKey);
        } else {
          setGeminiApiKey("");
        }

        if (storedTheme) setIsDarkMode(storedTheme === 'dark');

        if (loggedUser) {
          const userObj = JSON.parse(loggedUser);
          setCurrentUser(userObj);
          loadUserData(userObj.username);
        } else {
          setCurrentUser(null);
          loadUserData(null);
        }
      }, []);

      const loadUserData = (username) => {
        if (!username) {
          setSavedNodes([]);
          setSavedPipelines([]);
          return;
        }
        const prefix = `nodeflow_user_${username}`;
        const storedNodes = localStorage.getItem(`${prefix}_nodes`);
        const storedPipelines = localStorage.getItem(`${prefix}_pipelines`);
        setSavedNodes(storedNodes ? JSON.parse(storedNodes) : []);
        setSavedPipelines(storedPipelines ? JSON.parse(storedPipelines) : []);
      };

      const saveCurrentUserData = (updatedNodes, updatedPipelines) => {
        if (!currentUser) return;
        const prefix = `nodeflow_user_${currentUser.username}`;
        if (updatedNodes !== undefined) {
          setSavedNodes(updatedNodes);
          localStorage.setItem(`${prefix}_nodes`, JSON.stringify(updatedNodes));
        }
        if (updatedPipelines !== undefined) {
          setSavedPipelines(updatedPipelines);
          localStorage.setItem(`${prefix}_pipelines`, JSON.stringify(updatedPipelines));
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        const { username, password, email } = authForm;
        if (!username.trim() || !password.trim() || !email.trim()) {
          showCustomAlert("입력 확인", "아이디, 비밀번호, 복구용 이메일을 모두 입력해주세요.");
          return;
        }

        const users = JSON.parse(localStorage.getItem('nodeflow_registered_users') || '[]');
        if (users.some(u => u.username === username.trim())) {
          showCustomAlert("가입 오류", "이미 존재하는 아이디입니다.");
          return;
        }

        const newUser = { username: username.trim(), password: password.trim(), email: email.trim() };
        users.push(newUser);
        localStorage.setItem('nodeflow_registered_users', JSON.stringify(users));

        setCurrentUser(newUser);
        localStorage.setItem('nodeflow_logged_user', JSON.stringify(newUser));
        loadUserData(newUser.username);
        setAuthModal(null);
        setAuthForm({ username: '', password: '', email: '', newPassword: '' });
        showToast(`환영합니다, ${newUser.username}님! 가입 및 로그인되었습니다.`);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const { username, password } = authForm;
        const users = JSON.parse(localStorage.getItem('nodeflow_registered_users') || '[]');

      const calculateConnections = useCallback(() => {
        if (!canvasBoardRef.current || !isPipelineOpen) return;

        const newConnections = [];

        // 전체 노드 맵 구성

          const srcNode = allNodesMap[conn.from];
          const dstNode = allNodesMap[conn.to];
          const srcEl = nodeRefs.current[conn.from];
          const dstEl = nodeRefs.current[conn.to];

          if (!srcNode || !dstNode || !srcEl || !dstEl) return;

          let srcCurr = srcEl;
          let srcX = 0;
          let srcY = 0;
          while (srcCurr && srcCurr !== boardEl) {
            srcX += srcCurr.offsetLeft;
            srcY += srcCurr.offsetTop;
            srcCurr = srcCurr.offsetParent;

          let dstCurr = dstEl;
          let dstX = 0;
          let dstY = 0;

            dstY += dstCurr.offsetTop;

          const y2 = dstY + dstEl.offsetHeight / 2;

          const srcCategory = currentConfig.categories[srcNode.category] || { hex: "#a1a1aa" };

          newConnections.push({
            id: `${conn.from}->${conn.to}-${idx}`,
            srcId: conn.from,
            dstId: conn.to,
            x1,
            y1,
            x2,
            y2,
            srcColor: srcCategory.hex,
            label: conn.label || null
          });
        });

        setConnections(newConnections);

[필수 규칙]:
1. 노드 간 데이터 타입(MODEL, CLIP, VAE, LATENT, IMAGE, CONDITIONING 등)이 반드시 일치해야 합니다. 호환되지 않는 노드 간에는 절대로 연결선을 생성하지 마세요.
   - 예: EmptyLatentImage는 입력을 받지 않으며, Checkpoint의 MODEL을 EmptyLatentImage나 일반 TextEncode에 연결하면 안 됩니다.

반드시 ${platform} 공식 노드와 아래 카테고리만 사용하세요:
[${categoryKeys}]

순수 JSON 포맷으로만 응답하세요:
{
  "title": "워크플로우 이름",
  "desc": "목적 및 핵심 설명",
  "generalGuide": "파이프라인 전체 종합 설계 가이드 및 연결 주의사항 요약",
  "stages": [

        const targetModel = "models/gemini-2.5-flash";

                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="flex items-center justify-between pb-4 border-b border-borderLight dark:border-borderDark">
                    <div className="flex items-center gap-2">
                      <span className={`w-2.5 h-2.5 rounded-full ${currentConfig.categories[selectedNode.category]?.bg || 'bg-zinc-400'}`}></span>
                      <span className="text-xs font-semibold text-zinc-600 dark:text-zinc-400">
                        {platform} · {currentConfig.categories[selectedNode.category]?.label || selectedNode.category}
                      </span>
                    </div>
                    <button
                      onClick={() => setSelectedNode(null)}
                      className="w-7 h-7 rounded-full bg-zinc-100 dark:bg-[#101217] flex items-center justify-center text-zinc-400 hover:text-zinc-800 dark:hover:text-white transition-colors"
                    >
                      <svg className="w-3.5 h-3.5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                  </div>

                  <div className="mt-5 space-y-4">
                    <h3 className="text-xl font-bold text-zinc-900 dark:text-white">{selectedNode.name}</h3>
                    <div>
                      <h5 className="text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">노드 설명 및 사용법</h5>
                      <p className="text-sm text-zinc-700 dark:text-zinc-300 mt-1 leading-relaxed bg-zinc-50 dark:bg-[#101217] p-4 rounded-2xl border border-borderLight dark:border-borderDark/50">
                        {selectedNode.details}
                      </p>
                    </div>
                    <div>
                      <h5 className="text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">주의점 / 팁</h5>
                      <p className="text-sm text-zinc-700 dark:text-zinc-300 mt-1 leading-relaxed bg-zinc-50 dark:bg-[#101217] p-4 rounded-2xl border border-borderLight dark:border-borderDark/50">
                        {selectedNode.tip}
                      </p>
                    </div>
                  </div>

                  <div className="mt-6 flex justify-end">
                    <button
                      onClick={() => {
                        toggleSaveNode(selectedNode);
                        setSelectedNode(null);
                      }}
                      className="px-5 py-2 rounded-full bg-zinc-900 text-white dark:bg-white dark:text-black text-xs font-semibold hover:opacity-90 transition-all shadow-xs"
                    >
                      {savedNodes.some(n => n.id === selectedNode.id) ? '저장 해제' : '이 노드 저장하기'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 인증 모달 */}
            {authModal && (
              <div 
                className="fixed inset-0 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4 z-50"
                onClick={() => setAuthModal(null)}
              >
                <div 
                  className="bg-white dark:bg-[#161922] border border-borderLight dark:border-borderDark rounded-3xl p-6 md:p-8 max-w-sm w-full relative shadow-xl"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="flex items-center justify-between pb-3 mb-4 border-b border-borderLight dark:border-borderDark">
                    <h3 className="text-base font-bold text-zinc-900 dark:text-white">
                      {authModal === 'login' && '로그인'}
                      {authModal === 'register' && '회원가입'}
                      {authModal === 'find' && '아이디 / 비밀번호 찾기'}
                    </h3>
                    <button 
                      onClick={() => setAuthModal(null)}
                      className="text-zinc-400 hover:text-zinc-800 dark:hover:text-white p-1"
                    >
                      ✕
                    </button>
                  </div>

                  {authModal === 'login' && (
                    <form onSubmit={handleLogin} className="space-y-3.5">
                      <div>
                        <label className="text-[11px] font-semibold text-zinc-500 dark:text-zinc-400">아이디</label>
                        <input
                          type="text"
                          required
                          value={authForm.username}
                          onChange={(e) => setAuthForm({ ...authForm, username: e.target.value })}
                          className="w-full mt-1 bg-zinc-50 dark:bg-[#101217] border border-borderLight dark:border-borderDark rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-zinc-500 dark:text-zinc-400">비밀번호</label>
                        <input
                          type="password"
                          required
                          value={authForm.password}
                          onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                          className="w-full mt-1 bg-zinc-50 dark:bg-[#101217] border border-borderLight dark:border-borderDark rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full mt-2 py-2.5 rounded-xl bg-zinc-900 text-white dark:bg-white dark:text-black font-semibold text-xs hover:opacity-90 shadow-xs"
                      >
                        로그인
                      </button>
                      <div className="flex items-center justify-between text-[11px] text-zinc-400 pt-3 border-t border-zinc-100 dark:border-zinc-800">
                        <button type="button" onClick={() => { setAuthModal('find'); setFoundAccountInfo(null); }} className="hover:underline">
                          아이디/비밀번호 찾기
                        </button>
                        <button type="button" onClick={() => setAuthModal('register')} className="hover:underline text-emerald-500 font-semibold">
                          새 계정 만들기
                        </button>
                      </div>
                    </form>
                  )}

                  {authModal === 'register' && (
                    <form onSubmit={handleRegister} className="space-y-3.5">
                      <div>
                        <label className="text-[11px] font-semibold text-zinc-500 dark:text-zinc-400">아이디</label>
                        <input
                          type="text"
                          required
                          value={authForm.username}
                          onChange={(e) => setAuthForm({ ...authForm, username: e.target.value })}
                          className="w-full mt-1 bg-zinc-50 dark:bg-[#101217] border border-borderLight dark:border-borderDark rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-zinc-500 dark:text-zinc-400">비밀번호</label>
                        <input
                          type="password"
                          required
                          value={authForm.password}
                          onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                          className="w-full mt-1 bg-zinc-50 dark:bg-[#101217] border border-borderLight dark:border-borderDark rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-zinc-500 dark:text-zinc-400">분실 인증용 이메일</label>
                        <input
                          type="email"
                          required
                          placeholder="name@example.com"
                          value={authForm.email}
                          onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                          className="w-full mt-1 bg-zinc-50 dark:bg-[#101217] border border-borderLight dark:border-borderDark rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full mt-2 py-2.5 rounded-xl bg-emerald-500 text-black font-semibold text-xs hover:bg-emerald-400 shadow-xs"
                      >
                        가입 완료하기
                      </button>
                      <div className="text-center text-[11px] text-zinc-400 pt-3 border-t border-zinc-100 dark:border-zinc-800">
                        이미 계정이 있으신가요? <button type="button" onClick={() => setAuthModal('login')} className="hover:underline text-emerald-500 font-semibold ml-1">로그인</button>
                      </div>
                    </form>
                  )}

                  {authModal === 'find' && (
                    <form onSubmit={handleFindAccount} className="space-y-3.5">
                      <div>
                        <label className="text-[11px] font-semibold text-zinc-500 dark:text-zinc-400">가입 시 등록한 이메일</label>
                        <input
                          type="email"
                          required
                          placeholder="name@example.com"
                          value={authForm.email}
                          onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                          className="w-full mt-1 bg-zinc-50 dark:bg-[#101217] border border-borderLight dark:border-borderDark rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-emerald-500"
                        />
                      </div>

                      {foundAccountInfo && (
                        <div className="p-3 bg-zinc-100 dark:bg-[#101217] border border-borderLight dark:border-borderDark rounded-xl space-y-2">
                          <div className="text-xs">
                            <span className="text-zinc-400">가입된 아이디: </span>
                            <span className="font-bold text-emerald-500">{foundAccountInfo.username}</span>
                          </div>
                          <div>
                            <label className="text-[11px] font-semibold text-zinc-500 dark:text-zinc-400">새 비밀번호 설정</label>
                            <input
                              type="password"
                              placeholder="새 비밀번호 입력..."
                              value={authForm.newPassword}
                              onChange={(e) => setAuthForm({ ...authForm, newPassword: e.target.value })}
                              className="w-full mt-1 bg-white dark:bg-[#161922] border border-borderLight dark:border-borderDark rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-emerald-500"
                            />
                          </div>
                        </div>
                      )}

                      <button
                        type="submit"
                        className="w-full mt-2 py-2.5 rounded-xl bg-zinc-900 text-white dark:bg-white dark:text-black font-semibold text-xs hover:opacity-90 shadow-xs"
                      >
                        {foundAccountInfo ? '비밀번호 재설정 완료' : '계정 조회'}
                      </button>

                      <div className="text-center text-[11px] text-zinc-400 pt-3 border-t border-zinc-100 dark:border-zinc-800">
                        <button type="button" onClick={() => setAuthModal('login')} className="hover:underline">
                          로그인으로 돌아가기
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}

            {/* 커스텀 다이얼로그 팝업 */}
            {dialogConfig && (
              <div 
                className="fixed inset-0 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4 z-50"
                onClick={() => {
                  if (dialogConfig.onCancel) dialogConfig.onCancel();
                  else if (dialogConfig.onConfirm) dialogConfig.onConfirm();
                }}
              >
                <div 
                  className="bg-white dark:bg-[#161922] border border-borderLight dark:border-borderDark rounded-3xl p-6 md:p-7 max-w-md w-full relative shadow-xl"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="flex items-start gap-3.5 mb-4">
                    <div className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-zinc-100 dark:bg-zinc-800 text-zinc-500 border border-zinc-200 dark:border-zinc-700">
                      <svg className="w-4 h-4 stroke-current stroke-2 fill-none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></svg>
                    </div>

                    <div className="flex-1">
                      <h4 className="text-base font-bold text-zinc-900 dark:text-white">
                        {dialogConfig.title}
                      </h4>
                      <p className="text-xs md:text-sm text-zinc-600 dark:text-zinc-400 mt-1.5 leading-relaxed whitespace-pre-line">
                        {dialogConfig.message}
                      </p>
                    </div>
                  </div>

                  {dialogConfig.type === 'prompt' && (
                    <div className="mt-4 mb-2">
                      <input
                        type="text"
                        value={promptInputValue}
                        onChange={(e) => setPromptInputValue(e.target.value)}
                        placeholder="AI Studio 키를 입력하세요..."
                        className="w-full bg-zinc-50 dark:bg-[#101217] border border-borderLight dark:border-borderDark rounded-xl px-4 py-2.5 text-xs md:text-sm text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-zinc-400"
                        autoFocus
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') dialogConfig.onConfirm(promptInputValue);
                          else if (e.key === 'Escape') dialogConfig.onCancel();
                        }}
                      />
                    </div>
                  )}

                  <div className="mt-6 flex items-center justify-end gap-2.5 pt-3 border-t border-zinc-100 dark:border-zinc-800/80">
                    {dialogConfig.onCancel && (
                      <button
                        onClick={dialogConfig.onCancel}
                        className="px-4 py-2 rounded-full border border-borderLight dark:border-borderDark text-xs font-semibold text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors"
                      >
                        취소
                      </button>
                    )}
                    <button
                      onClick={() => {
                        if (dialogConfig.type === 'prompt') {
                          dialogConfig.onConfirm(promptInputValue);
                        } else {
                          dialogConfig.onConfirm();
                        }
                      }}
                      className="px-5 py-2 rounded-full bg-zinc-900 text-white dark:bg-white dark:text-black text-xs font-bold hover:opacity-90 transition-colors shadow-xs"
                    >
                      확인
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 우측 하단 고정 상단 이동 버튼 */}
            {showScrollTop && (
              <button
                onClick={scrollToTop}
                className="fixed bottom-8 right-8 z-40 w-11 h-11 rounded-full bg-white dark:bg-[#1a1e27] border border-borderLight dark:border-borderDark shadow-lg hover:border-zinc-400 dark:hover:border-zinc-500 text-zinc-600 dark:text-zinc-300 flex items-center justify-center transition-all hover:scale-105 active:scale-95"
                title="페이지 상단으로 이동"
                aria-label="Scroll to top"
              >
                <svg className="w-4 h-4 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
                  <path d="M5 15l7-7 7 7" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
              </button>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
